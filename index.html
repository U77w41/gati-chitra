<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gati-chitra</title>
  </head>
  <body>
    <div id="app">
      <div id="toolbar" role="toolbar" aria-label="Diagram tools">
        <button id="btn-new">New</button>
        <button id="btn-open">Open</button>
        <button id="btn-save-mmd">Save .mmd</button>
        <button id="btn-undo" disabled>Undo</button>
        <button id="btn-redo" disabled>Redo</button>
        <button id="btn-fit">Fit</button>
        <button id="btn-autolayout" disabled>Auto-layout</button>
        <button id="btn-present" disabled>Present</button>
        <button id="btn-export" disabled>Export</button>
        <button id="btn-share" disabled>Share</button>
        <button id="btn-templates" disabled>Templates</button>
        <select id="add-shape">
          <option value="rect">Rectangle</option>
          <option value="round">Rounded</option>
          <option value="stadium">Stadium</option>
          <option value="circle">Circle</option>
          <option value="diamond">Diamond</option>
          <option value="hexagon">Hexagon</option>
          <option value="parallelogram">Parallelogram</option>
          <option value="parallelogramAlt">Parallelogram reversed</option>
          <option value="cylinder">Cylinder</option>
          <option value="subroutine">Subroutine</option>
        </select>
        <button id="btn-add-node">Add node</button>
        <input type="file" id="file-picker" accept=".mmd,.txt" style="display: none" />
      </div>
      <div id="workspace">
        <section id="text-panel">
          <textarea id="source" spellcheck="false" aria-label="Mermaid text"></textarea>
          <ul id="diagnostics" aria-live="polite"></ul>
        </section>
        <section id="canvas-panel">
          <canvas id="canvas" role="img"></canvas>
          <div id="props" hidden>
            <div id="prop-section-label">
              <label for="prop-label">Label</label>
              <input type="text" id="prop-label" />
            </div>
            <div id="prop-section-node">
              <label for="prop-shape">Shape</label>
              <select id="prop-shape">
                <option value="rect">Rectangle</option>
                <option value="round">Rounded</option>
                <option value="stadium">Stadium</option>
                <option value="circle">Circle</option>
                <option value="diamond">Diamond</option>
                <option value="hexagon">Hexagon</option>
                <option value="parallelogram">Parallelogram</option>
                <option value="parallelogramAlt">Parallelogram reversed</option>
                <option value="cylinder">Cylinder</option>
                <option value="subroutine">Subroutine</option>
              </select>
              <label for="prop-fill">Fill</label>
              <input type="color" id="prop-fill" />
              <label for="prop-stroke">Stroke</label>
              <input type="color" id="prop-stroke" />
              <button id="prop-clear-colours">Clear colours</button>
            </div>
            <div id="prop-section-edge">
              <label for="prop-kind">Kind</label>
              <select id="prop-kind">
                <option value="arrow">Arrow</option>
                <option value="open">Line</option>
                <option value="dottedArrow">Dotted arrow</option>
                <option value="dotted">Dotted line</option>
                <option value="thickArrow">Thick arrow</option>
                <option value="thick">Thick line</option>
                <option value="circleEnd">Circle end</option>
                <option value="crossEnd">Cross end</option>
                <option value="bidirectional">Both ways</option>
              </select>
              <button id="prop-reverse">Reverse</button>
            </div>
            <button id="prop-delete">Delete</button>
          </div>
          <textarea id="inline-edit" style="display: none;"></textarea>
          <div id="canvas-controls">
            <select id="anim-style">
              <option value="pulse">pulse</option>
              <option value="traffic">traffic</option>
              <option value="dash">dash</option>
              <option value="off">off</option>
            </select>
            <input id="anim-speed" type="range" min="0.25" max="3" step="0.25" value="1" />
            <input id="anim-density" type="range" min="1" max="10" step="1" value="4" />
            <label><input id="anim-glow" type="checkbox" /> Glow</label>
            <button id="anim-pause" aria-pressed="false">Pause</button>
            <select id="theme">
              <option value="auto">Match page</option>
              <option value="daylight">Daylight</option>
              <option value="midnight">Midnight</option>
              <option value="lagoon">Lagoon</option>
              <option value="ember">Ember</option>
            </select>
          </div>
          <div id="message" aria-live="polite"></div>
        </section>
      </div>
      <dialog id="export-panel">
        <div class="dialog-header">
          <h2>Export</h2>
          <button id="export-close" aria-label="Close">✕</button>
        </div>
        <div class="dialog-body">
          <label for="export-name">Filename</label>
          <input type="text" id="export-name" value="diagram" />

          <label for="export-mode">Frame</label>
          <select id="export-mode">
            <option value="content">Fit to content</option>
            <option value="slide">16:9 slide frame</option>
          </select>

          <label for="export-scale">Scale</label>
          <select id="export-scale">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
          </select>

          <label><input type="checkbox" id="export-transparent" /> Transparent background</label>

          <progress id="export-progress" hidden></progress>
          <div id="export-message" aria-live="polite"></div>
        </div>
        <div class="dialog-footer">
          <button id="export-cancel">Cancel</button>
          <button id="export-png">Save as PNG</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
