name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Compute base path and site URLs
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          # BASE_PATH is /gati-chitra/
          if [ "${repo,,}" = "$owner.github.io" ]; then base="/"; else base="/gati-chitra/"; fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=https://$owner.github.io$base" >> "$GITHUB_ENV"
          echo "VITE_SOURCE_URL=https://github.com/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v5
